---
name: asm-lsp
description: Language server for NASM/GAS/GO Assembly.
homepage: https://github.com/bergercookie/asm-lsp
licenses:
  - BSD-2-Clause
languages:
  - Assembly
categories:
  - LSP

source:
  id: pkg:github/bergercookie/asm-lsp@v0.10.1
  asset:
    - target: darwin_arm64
      file: asm-lsp-aarch64-apple-darwin.tar.gz
      bin: asm-lsp

    - target: darwin_x64
      file: asm-lsp-x86_64-apple-darwin.tar.gz
      bin: asm-lsp

    - target: linux_x64_gnu
      file: asm-lsp-x86_64-unknown-linux-gnu.tar.gz
      bin: asm-lsp

schemas:
  lsp: https://raw.githubusercontent.com/bergercookie/asm-lsp/{{ version }}/asm-lsp_config_schema.json

bin:
  asm-lsp: "{{source.asset.bin}}"

neovim:
  lspconfig: asm_lsp
